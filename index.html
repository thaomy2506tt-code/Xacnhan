<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác Nhận Vượt Link</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 420px;
      width: 90%;
      text-align: center;
      border: 1px solid #334155;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { margin: 0 0 10px; font-size: 22px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.5; }
    .time-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-weight: bold;
      color: #38bdf8;
      border: 1px dashed #38bdf8;
    }
    .error-text { color: #f87171; }
    .success-text { color: #4ade80; }
  </style>
</head>
<body>

<div class="card" id="box">
  <div class="icon">⏳</div>
  <h2>Đang kiểm tra xác thực...</h2>
  <p>Vui lòng chờ trong giây lát.</p>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzR-wzBDrEN1cg4wcKQyvHzly8gBtOEv4sLUy_3hue0bOWcRwivBjzS9w58wKkmlk7Y/exec";

  async function verifyAccess() {
    const box = document.getElementById("box");
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");
    const ref = urlParams.get("ref") || "";

    if (!token || !ref.toLowerCase().includes("link4m")) {
      renderError("Truy cập bị từ chối!", "Bạn chưa vượt qua Link4m hoặc đang mở thẳng link gốc.");
      return;
    }

    window.history.replaceState({}, document.title, window.location.pathname);

    try {
      const response = await fetch(`${SCRIPT_URL}?action=verify&token=${encodeURIComponent(token)}&ref=${encodeURIComponent(ref)}`);
      const result = await response.json();

      if (result.status === "success") {
        box.innerHTML = `
          <div class="icon">✅</div>
          <h2 class="success-text">Xác Nhận Thành Công!</h2>
          <p>Hệ thống ghi nhận bạn đã hoàn thành vượt link từ <b>Link4m</b>.</p>
          <div class="time-box">Thời gian: ${result.time}</div>
        `;
      } else {
        renderError("Không Thể Xác Nhận!", result.message);
      }
    } catch (err) {
      renderError("Lỗi Kết Nối!", "Không thể kiểm tra dữ liệu với máy chủ. Vui lòng thử lại.");
    }
  }

  function renderError(title, msg) {
    document.getElementById("box").innerHTML = `
      <div class="icon">⛔</div>
      <h2 class="error-text">${title}</h2>
      <p>${msg}</p>
    `;
  }

  verifyAccess();
</script>

</body>
</html>
