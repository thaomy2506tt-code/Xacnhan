<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <title>Xác Nhận Vượt Link4m</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0b0d14; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .card {
      background: #131722; border: 2px solid #00f0ff; border-radius: 16px;
      padding: 26px 22px; max-width: 390px; width: 100%; text-align: center;
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.22);
    }
    h2 { margin: 0 0 10px; font-size: 20px; }
    .sub { margin: 6px 0; color: #b8d4f0; font-size: 13.5px; line-height: 1.5; }
    .badge {
      display: inline-block; margin-top: 14px; padding: 8px 14px;
      background: rgba(0, 255, 157, 0.12); border: 1px solid #00ff9d;
      border-radius: 8px; color: #00ff9d; font-size: 12.5px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h2 style="color:#00f0ff">⏳ ĐANG XÁC NHẬN VƯỢT LINK...</h2>
    <p class="sub">Vui lòng đợi giây lát để hệ thống kiểm tra phiên truy cập.</p>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzR-wzBDrEN1cg4wcKQyvHzly8gBtOEv4sLUy_3hue0bOWcRwivBjz59w58wKkmlk7Y/exec";
    const app = document.getElementById("app");

    function showDenied(msg) {
      app.style.borderColor = "#ff4d5a";
      app.innerHTML =
        '<h2 style="color:#ff6b6b">⛔ Truy cập bị từ chối!</h2>' +
        '<p class="sub">' + msg + '</p>';
    }

    (async function verify() {
      const ref = (document.referrer || "").toLowerCase();
      if (!ref.includes("link4m.net") && !ref.includes("link4m.com")) {
        showDenied("Bạn đang mở lại link cũ hoặc truy cập thẳng link gốc. Vui lòng vượt lại từ đầu qua Link4m.");
        return;
      }

      try { history.replaceState(null, "", location.pathname); } catch (e) {}

      try {
        const r1 = await fetch(APPS_SCRIPT_URL + "?action=create&ref=" + encodeURIComponent(ref), { cache: "no-store" });
        const d1 = await r1.json();
        if (!d1 || !d1.ok || !d1.token) {
          showDenied((d1 && d1.error) || "Không thể tạo phiên xác nhận.");
          return;
        }

        const r2 = await fetch(APPS_SCRIPT_URL + "?action=claim&token=" + encodeURIComponent(d1.token), { cache: "no-store" });
        const d2 = await r2.json();
        if (!d2 || !d2.ok) {
          showDenied((d2 && d2.error) || "Phiên xác nhận không hợp lệ hoặc đã dùng.");
          return;
        }

        app.style.borderColor = "#00ff9d";
        app.innerHTML =
          '<h2 style="color:#00ff9d">✅ XÁC NHẬN VƯỢT LINK THÀNH CÔNG!</h2>' +
          '<p class="sub">Hệ thống đã ghi nhận lượt vượt Link4m hợp lệ của bạn.</p>' +
          '<div class="badge">🕒 Thời gian: ' + d2.time + '</div>';
      } catch (e) {
        showDenied("Lỗi kết nối máy chủ xác nhận. Vui lòng thử lại.");
      }
    })();
  </script>
</body>
</html>
